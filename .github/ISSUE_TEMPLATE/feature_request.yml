name: Feature request
description: Suggest an idea or a change
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you think it could work. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: Other options you looked at
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Consumer library
        - Producer library
        - Core library
        - Compiler plugin
        - Docs
        - Not sure
    validations:
      required: true
